{{- range .Values.platformApplications }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: {{ .repoURL | quote }}
      chart: {{ .chart | quote }}
      targetRevision: {{ .version | quote }}
      helm:
        releaseName: {{ .name | quote }}
        valueFiles:
          - $values/{{ .valuesFile }}
    - repoURL: {{ $.Values.appsRepoUrl | quote }}
      targetRevision: {{ $.Values.appsRevision | quote }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace | quote }}
  syncPolicy:
    {{- if .automated }}
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
---
{{- end }}
