apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: code.forgejo.org/forgejo-helm
    chart: forgejo
    targetRevision: 17.1.0
    helm:
      releaseName: forgejo
      values: |
        replicaCount: 1
        strategy:
          type: Recreate
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        persistence:
          size: 8Gi
          storageClass: longhorn-lab-single
        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: {{ include "talos-lab.sslipHost" (dict "root" . "name" "git") }}
              paths:
                - path: /
                  pathType: Prefix
            - host: {{ include "talos-lab.labHost" (dict "root" . "name" "git") }}
              paths:
                - path: /
                  pathType: Prefix
        gitea:
          admin:
            username: labadmin
            email: admin@{{ .Values.labBaseDomain }}
            passwordMode: initialOnlyRequireReset
          metrics:
            enabled: true
            serviceMonitor:
              enabled: false
              namespace: monitoring
          config:
            server:
              ROOT_URL: https://{{ include "talos-lab.labHost" (dict "root" . "name" "git") }}/
              START_SSH_SERVER: false
            actions:
              ENABLED: true
              DEFAULT_ACTIONS_URL: https://data.forgejo.org
            packages:
              ENABLED: false
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
