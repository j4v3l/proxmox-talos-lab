apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ required "gitOpsRepoUrl is required" .Values.gitOpsRepoUrl | quote }}
    targetRevision: {{ .Values.gitOpsRevision | quote }}
    path: gitops/apps/whoami
    helm:
      releaseName: whoami
      values: |
        hosts:
          - {{ include "talos-lab.sslipHost" (dict "root" . "name" "whoami") }}
          - {{ include "talos-lab.labHost" (dict "root" . "name" "whoami") }}
  destination:
    server: https://kubernetes.default.svc
    namespace: lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
