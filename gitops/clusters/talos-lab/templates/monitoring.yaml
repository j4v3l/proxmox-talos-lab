apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.1.0
    helm:
      releaseName: monitoring
      values: |
        alertmanager:
          enabled: false
        defaultRules:
          rules:
            etcd: false
            kubeProxy: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        nodeExporter:
          enabled: false
        grafana:
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - {{ include "talos-lab.sslipHost" (dict "root" . "name" "grafana") }}
              - {{ include "talos-lab.labHost" (dict "root" . "name" "grafana") }}
          persistence:
            enabled: true
            type: pvc
            storageClassName: longhorn-lab-single
            accessModes:
              - ReadWriteOnce
            size: 2Gi
          sidecar:
            datasources:
              alertmanager:
                enabled: false
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
        prometheus:
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - {{ include "talos-lab.sslipHost" (dict "root" . "name" "prometheus") }}
              - {{ include "talos-lab.labHost" (dict "root" . "name" "prometheus") }}
          prometheusSpec:
            retention: 3d
            replicas: 1
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelector: {}
            serviceMonitorNamespaceSelector: {}
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorSelector: {}
            podMonitorNamespaceSelector: {}
            probeSelectorNilUsesHelmValues: false
            probeSelector: {}
            probeNamespaceSelector: {}
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn-lab-single
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi
            resources:
              requests:
                cpu: 150m
                memory: 512Mi
              limits:
                memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
