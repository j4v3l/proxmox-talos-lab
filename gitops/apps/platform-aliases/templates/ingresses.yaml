{{- range .Values.aliases }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}-alias
  namespace: {{ .namespace }}
spec:
  ingressClassName: {{ $.Values.ingressClassName }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .serviceName }}
                port:
                  number: {{ .servicePort }}
---
{{- end }}
