apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      containers:
        - name: forgejo-runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - /bin/sh
            - -ec
            - |
              cat >/tmp/runner-config.yaml <<EOF
              log:
                level: info
              runner:
                file: /data/.runner
                capacity: 1
                insecure: false
                labels:
                  - {{ .Values.runnerLabel }}
              cache:
                enabled: false
              host:
                workdir_parent: /data/workdir
              server:
                connections:
                  forgejo:
                    url: ${FORGEJO_INSTANCE_URL}
                    uuid: ${FORGEJO_RUNNER_UUID}
                    token: ${FORGEJO_RUNNER_TOKEN}
              EOF
              exec forgejo-runner daemon -c /tmp/runner-config.yaml
          envFrom:
            - secretRef:
                name: {{ .Values.connectionSecretName }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
