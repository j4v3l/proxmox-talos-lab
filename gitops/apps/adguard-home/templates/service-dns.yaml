apiVersion: v1
kind: Service
metadata:
  name: adguard-home-dns
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.dnsLoadBalancerIP }}
  selector:
    app.kubernetes.io/name: adguard-home
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
