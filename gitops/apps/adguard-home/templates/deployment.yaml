apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home
  labels:
    app.kubernetes.io/name: adguard-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard-home
    spec:
      initContainers:
        - name: bootstrap-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /opt/adguardhome/conf /opt/adguardhome/work
              if [ ! -f /opt/adguardhome/conf/AdGuardHome.yaml ]; then
                cp /bootstrap/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml
              fi
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome
            - name: bootstrap
              mountPath: /bootstrap
      containers:
        - name: adguard-home
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: web
              containerPort: 3000
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adguard-home-data
        - name: bootstrap
          configMap:
            name: adguard-home-bootstrap
